# project-generator/templates/cloudbuild.yaml.tmplを基にした唯一のデプロイ定義。
# 対応するGitHubトリガーは1件のみ。Cloud Run Console接続や--sourceを使わない。
steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --target=production
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$COMMIT_SHA
      - --service-account=${_SERVICE}-run@$PROJECT_ID.iam.gserviceaccount.com
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --concurrency=20
      - --cpu-throttling
      - --no-cpu-boost
      - --no-session-affinity
      - --min-instances=0
      - --max-instances=1
      - --timeout=300
      - --allow-unauthenticated
      - --set-env-vars=STORE=firestore,SECURE_COOKIE=true,NODE_ENV=production,HOST=0.0.0.0
      - --update-secrets=BOOTSTRAP_TOKEN=${_BOOTSTRAP_SECRET}:latest
substitutions:
  _REGION: asia-northeast1
  _SERVICE: household-ledger
  _BOOTSTRAP_SECRET: household-ledger-bootstrap
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_STANDARD_2
timeout: 600s
